<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .signup-card {
      background: #fff;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0px 6px 20px rgba(0,0,0,0.2);
      width: 400px;
      text-align: center;
    }
    .signup-card h2 {
      margin-bottom: 1.5rem;
      font-weight: bold;
      color: #333;
    }
    .form-control {
      border-radius: 8px;
    }
    .btn-signup {
      width: 100%;
      border-radius: 8px;
      padding: 10px;
      font-weight: bold;
    }
    .extra-links {
      margin-top: 15px;
      text-align: center;
    }
    .extra-links a {
      font-size: 0.9rem;
      text-decoration: none;
      color: #007bff;
    }
    .extra-links a:hover {
      text-decoration: underline;
    }
    .error-msg {
      color: red;
      margin-top: 10px;
    }
    .success-msg {
      color: green;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="signup-card">
    <h2><i class="fas fa-user-plus"></i> Sign Up</h2>

    <form th:action="@{/doSignup}" th:object="${user}" method="post">
      <div class="mb-3 input-group">
        <span class="input-group-text"><i class="fas fa-user"></i></span>
        <input type="text" class="form-control" name="username" placeholder="Username" required>
        <div th:if="${#fields.hasErrors('username')}" class="error-msg"
         th:errors="*{username}">Invalid Username</div>
      </div>

      <div class="mb-3 input-group">
        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
        <input type="email" class="form-control" name="email" placeholder="Email" required>
        <div th:if="${#fields.hasErrors('email')}" class="error-msg"
         th:errors="*{email}">Invalid Email</div>
      </div>

      <div class="mb-3 input-group">
        <span class="input-group-text"><i class="fas fa-lock"></i></span>
        <input type="password" class="form-control" name="password" placeholder="Password" required>
      </div>

      <div class="mb-3 input-group">
        <span class="input-group-text"><i class="fas fa-lock"></i></span>
        <input type="password" class="form-control" name="confirmPassword" placeholder="Confirm Password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-signup">
        <i class="fas fa-user-check"></i> Create Account
      </button>
      <!-- Error & Success Messages -->
    <div th:if="${error}" class="error-msg" th:text="${error}"></div>
    <div th:if="${success}" class="success-msg" th:text="${success}"></div>
    </form>

    <div class="extra-links">
      Already have an account? <a th:href="@{/login}">Login here</a>
    </div>
  </div>
  
  

</body>
</html>
