<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Forgot Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .forgot-card {
      background: #fff;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0px 6px 20px rgba(0,0,0,0.2);
      width: 400px;
      text-align: center;
    }
    .forgot-card h2 {
      margin-bottom: 1.5rem;
      font-weight: bold;
      color: #333;
    }
    .form-control {
      border-radius: 8px;
    }
    .btn-forgot {
      width: 100%;
      border-radius: 8px;
      padding: 10px;
      font-weight: bold;
    }
    .extra-links {
      margin-top: 15px;
      text-align: center;
    }
    .extra-links a {
      font-size: 0.9rem;
      text-decoration: none;
      color: #007bff;
    }
    .extra-links a:hover {
      text-decoration: underline;
    }
    .info-msg {
      color: green;
      margin-top: 10px;
    }
    .error-msg {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="forgot-card">
    <h2><i class="fas fa-unlock-alt"></i> Forgot Password</h2>

    <form th:action="@{/doForgotPassword}" method="post">
      <div class="mb-3 input-group">
        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
        <input type="email" class="form-control" name="email" placeholder="Enter your registered email" required>
      </div>

      <button type="submit" class="btn btn-primary btn-forgot">
        <i class="fas fa-paper-plane"></i> Send Reset Link
      </button>
    </form>

    <!-- Optional messages -->
    <div th:if="${param.success}" class="info-msg">Password reset link sent to your email.</div>
    <div th:if="${param.error}" class="error-msg">Email not found in our records.</div>

    <div class="extra-links">
      <a th:href="@{/login}"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </div>
  </div>

</body>
</html>
