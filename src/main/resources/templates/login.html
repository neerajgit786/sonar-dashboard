<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .login-card {
      background: #fff;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0px 6px 20px rgba(0,0,0,0.2);
      width: 350px;
      text-align: center;
    }
    .login-card h2 {
      margin-bottom: 1.5rem;
      font-weight: bold;
      color: #333;
    }
    .form-control {
      border-radius: 8px;
    }
    .btn-login {
      width: 100%;
      border-radius: 8px;
      padding: 10px;
      font-weight: bold;
    }
    .extra-links {
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
    }
    .extra-links a {
      font-size: 0.9rem;
      text-decoration: none;
      color: #007bff;
    }
    .extra-links a:hover {
      text-decoration: underline;
    }
    .error-msg {
      color: red;
      margin-top: 10px;
    }
    .success-msg {
      color: green;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2><i class="fas fa-user-circle"></i> Login</h2>

    <form th:action="@{/doLogin}" method="post">
      <div class="mb-3 input-group">
        <span class="input-group-text"><i class="fas fa-user"></i></span>
        <input type="text" class="form-control" name="username" placeholder="Username" required>
      </div>

      <div class="mb-3 input-group">
        <span class="input-group-text"><i class="fas fa-lock"></i></span>
        <input type="password" class="form-control" name="password" placeholder="Password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-login">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
    </form>

    <!-- Error / Logout messages -->
    <div th:if="${param.error}" class="error-msg">Invalid username or password</div>
    <div th:if="${param.logout}" class="success-msg">You have been logged out</div>
    <div th:if="${param.signupSuccess}" class="success-msg">Account created successfully. Please login.</div>

    <!-- Signup & Forgot Password Links -->
    <div class="extra-links">
      <a th:href="@{/signup}"><i class="fas fa-user-plus"></i> Sign Up</a>
      <a th:href="@{/forgot-password}"><i class="fas fa-unlock-alt"></i> Forgot Password?</a>
    </div>
  </div>

</body>
</html>
